
# TBBD GitHub to Azure Repos synchronization

trigger:
  branches:
    include:
      - feature/workplace-hub-recovery

pr: none

pool:
  name: TBBD-Agent-Pool

variables:
  - group: TBBD-Git-Sync

steps:
  - checkout: self
    fetchDepth: 0

  - task: Bash@3
    displayName: "Sync GitHub branch to Azure Repos"
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        case "$BUILD_SOURCEBRANCH" in
          refs/heads/*) ;;
          *)
            echo "Only branch builds are supported."
            exit 1
            ;;
        esac

        BRANCH="${BUILD_SOURCEBRANCH#refs/heads/}"

        AUTH="$(printf ':%s' "$TBBD_DevOps_PAT" | base64 | tr -d '\n')"

        git -c http.extraheader="AUTHORIZATION: Basic $AUTH" \
          push "$AZURE_REPO_URL" "HEAD:refs/heads/$BRANCH"

    env:
      TBBD_DevOps_PAT: $(TBBD_DevOps_PAT)
      AZURE_REPO_URL: "https://dev.azure.com/Loyal-Trade-BD/Talent%20Bridge%20BD/_git/TBBD-HR-Portal"
