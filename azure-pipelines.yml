
# TBBD HR Portal
# Talent Bridge BD - Azure DevOps CI Pipeline
# Native macOS ARM64 self-hosted agent
# CI validation only - no deployment

trigger:
  - main

pr:
  - main

pool:
  name: 'TBBD-Agent-Pool'
  demands:
    - Agent.Name -equals TBBD-Mac-Agent-01-ARM-native

variables:
  pythonExecutable: '/opt/homebrew/bin/python3.11'
  nodeVersion: '20.x'

steps:
  # Checkout repository
  - checkout: self
    displayName: 'Checkout TBBD HR Portal repository'
    fetchDepth: 1

  # Display build information
  - task: Bash@3
    displayName: 'Display build information'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "=========================================="
        echo "TBBD HR Portal - Azure DevOps CI"
        echo "=========================================="
        echo "Repository: $(Build.Repository.Name)"
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
        echo "Build ID: $(Build.BuildId)"
        echo "Agent: $(Agent.Name)"
        echo "Agent OS: $(Agent.OS)"
        echo "Agent Architecture: $(Agent.OSArchitecture)"

  # Verify native macOS ARM64 agent
  - task: Bash@3
    displayName: 'Verify Mac agent environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "Agent: ${AGENT_NAME:-unknown}"
        echo "Machine: ${AGENT_MACHINENAME:-unknown}"

        uname -a

        echo "Architecture:"
        uname -m

        echo "Bash: ${BASH_VERSION:-unknown}"

        df -h .

  # Verify and create native Python 3.11 environment
  - task: Bash@3
    displayName: 'Create native Python 3.11 ARM64 environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        export PATH="/opt/homebrew/bin:$PATH"

        PYTHON_BIN="$(pythonExecutable)"

        if [ ! -x "$PYTHON_BIN" ]; then
          echo "ERROR: Python executable not found: $PYTHON_BIN"
          exit 1
        fi

        "$PYTHON_BIN" -c "
        import sys
        import platform

        print('Executable:', sys.executable)
        print('Version:', sys.version)
        print('Architecture:', platform.machine())

        assert sys.version_info[:2] == (3, 11), 'Python 3.11 is required'
        assert platform.machine() == 'arm64', 'ARM64 Python is required'
        "

        VENV_DIR="$(Agent.TempDirectory)/tbbd-ci-venv-$(Build.BuildId)"

        "$PYTHON_BIN" -m venv "$VENV_DIR"

        CI_PYTHON="$VENV_DIR/bin/python"

        "$CI_PYTHON" --version
        "$CI_PYTHON" -m pip --version

        echo "##vso[task.setvariable variable=TBBD_PYTHON]$CI_PYTHON"

        echo "Native Python 3.11 ARM64 environment created."

  # Install backend and CI test dependencies
  - task: Bash@3
    displayName: 'Install backend and test dependencies'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        if [ ! -f requirements.txt ]; then
          echo "ERROR: requirements.txt is missing."
          exit 1
        fi

        "$(TBBD_PYTHON)" -m pip install --upgrade pip

        "$(TBBD_PYTHON)" -m pip install -r requirements.txt

        # pytest is required for CI testing only.
        # Keep CI-only test dependencies out of production requirements.
        "$(TBBD_PYTHON)" -m pip install pytest

        "$(TBBD_PYTHON)" -m pip check
        "$(TBBD_PYTHON)" -m pytest --version

        echo "Backend and test dependencies installed successfully."

  # Configure Node.js 20
  - task: UseNode@1
    displayName: 'Use Node.js 20'
    inputs:
      version: '$(nodeVersion)'
      checkLatest: false

  # Verify Node.js environment
  - task: Bash@3
    displayName: 'Verify Node.js environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        node --version
        npm --version

        node -e "
        const major = Number(process.versions.node.split('.')[0]);

        if (major !== 20) {
          console.error('Node.js 20 is required.');
          process.exit(1);
        }
        "

        echo "Node.js 20 verified."

  # Install frontend dependencies
  - task: Bash@3
    displayName: 'Install frontend dependencies'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)/frontend"

        if [ ! -f package.json ]; then
          echo "ERROR: frontend/package.json is missing."
          exit 1
        fi

        if [ ! -f package-lock.json ]; then
          echo "ERROR: frontend/package-lock.json is missing."
          exit 1
        fi

        npm ci

        echo "Frontend dependencies installed successfully."

  # Build React frontend
  - task: Bash@3
    displayName: 'Build frontend'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)/frontend"

        npm run build

        if [ ! -f dist/index.html ]; then
          echo "ERROR: frontend build did not produce dist/index.html."
          exit 1
        fi

        echo "Frontend build completed successfully."

  # Prepare frontend assets for backend tests
  - task: Bash@3
    displayName: 'Prepare frontend assets'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        if [ ! -f frontend/dist/index.html ]; then
          echo "ERROR: frontend/dist/index.html is missing."
          exit 1
        fi

        if [ ! -f frontend/dist/redirect.html ]; then
          echo "ERROR: frontend/dist/redirect.html is missing."
          exit 1
        fi

        if [ ! -d frontend/dist/assets ]; then
          echo "ERROR: frontend/dist/assets is missing."
          exit 1
        fi

        mkdir -p dist

        cp -R frontend/dist/. dist/

        test -f dist/index.html
        test -f dist/redirect.html
        test -d dist/assets

        echo "Frontend assets prepared successfully."

  # Compile maintained Python backend
  - task: Bash@3
    displayName: 'Validate Python source'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        "$(TBBD_PYTHON)" -m compileall -q \
          main.py \
          api \
          services \
          models \
          repositories \
          tests

        echo "Python source compilation completed successfully."

  # Run backend tests
  - task: Bash@3
    displayName: 'Run backend tests'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        "$(TBBD_PYTHON)" -m pytest -q --ignore=test_email_send.py

  # Final CI summary
  - task: Bash@3
    displayName: 'Final CI summary'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "=========================================="
        echo "TBBD HR Portal CI completed successfully."
        echo "=========================================="

        echo "Agent: ${AGENT_NAME:-unknown}"
        echo "Build ID: $(Build.BuildId)"
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"

        echo "Native Python 3.11 ARM64: verified"
        echo "Node.js 20: verified"
        echo "Backend dependencies: installed"
        echo "Frontend production build: completed"
        echo "Frontend assets: verified"
        echo "Python compilation: completed"
        echo "Backend tests: passed"

        echo "No deployment or production changes performed."
