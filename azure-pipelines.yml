# TBBD HR Portal
# Azure DevOps CI Pipeline
# Self-hosted Mac CI validation only
# No deployment or production changes

trigger:
  - main

pr:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'
  nodeVersion: '20.x'

steps:
  # Checkout repository
  - checkout: self
    displayName: 'Checkout TBBD HR Portal repository'

  # Display build information
  - script: |
      set -eu
      echo "TBBD HR Portal - Azure DevOps CI"
      echo "Repository: $(Build.Repository.Name)"
      echo "Branch: $(Build.SourceBranch)"
      echo "Commit: $(Build.SourceVersion)"
      echo "Build ID: $(Build.BuildId)"
    displayName: 'Display build information'

  - task: UsePythonVersion@0
    displayName: 'Set Python version'
    inputs:
      versionSpec: '$(pythonVersion)'
      architecture: 'x64'

  # Python 3.11 - Microsoft-hosted Ubuntu environment
  - script: |
      set -eu

      echo "Checking Python environment..."
      command -v python
      python --version
      python -m pip --version
      python -c "import platform; print('Architecture:', platform.machine())"
    displayName: 'Verify Python 3.11 environment'

  # Install application dependencies and CI-only test dependency
  - script: |
      set -eu

      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt

      # Install pytest for CI testing only.
      # Keep pytest out of production requirements.txt.
      python -m pip install pytest
      python -m pytest --version
    displayName: 'Install backend dependencies'

  # Node.js 20
  - task: UseNode@1
    displayName: 'Set Node.js version'
    inputs:
      version: '$(nodeVersion)'

  # Verify Node.js environment
  - script: |
      set -eu
      node --version
      npm --version
    displayName: 'Verify Node.js environment'

  # Install frontend dependencies
  - script: |
      set -eu
      npm ci
    workingDirectory: 'frontend'
    displayName: 'Install frontend dependencies'

  # Build React frontend
  - script: |
      set -eu
      npm run build
    workingDirectory: 'frontend'
    displayName: 'Build React frontend'

  # Copy Vite output to the root directory expected by main.py
  - script: |
      set -eu

      echo "Checking Vite build output..."
      test -f frontend/dist/index.html
      test -f frontend/dist/redirect.html
      test -d frontend/dist/assets

      echo "Copying frontend build into root dist directory..."
      mkdir -p dist
      cp -R frontend/dist/. dist/

      echo "Verifying application frontend assets..."
      test -f dist/index.html
      test -f dist/redirect.html
      test -d dist/assets

      echo "Frontend assets are ready for backend tests."
    displayName: 'Prepare frontend assets for backend tests'

  # Validate Python source after frontend build
  - script: |
      set -eu
      python -m compileall -q .
    displayName: 'Validate Python source'

  # Run backend tests after frontend assets exist
  - script: |
      set -eu
      python -m pytest -q --ignore=test_email_send.py
    displayName: 'Run backend tests'

  # Final CI summary
  - script: |
      set -eu
      echo "TBBD HR Portal CI validation completed."
      echo 
      echo "Python source validation: completed"
      echo "Backend tests: passed"
      echo "Frontend production build: completed"
      echo "Frontend assets: verified"
      echo "No deployment or production changes performed."
    displayName: 'CI build summary'