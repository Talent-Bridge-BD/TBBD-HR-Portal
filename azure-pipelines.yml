
# TBBD HR Portal
# Talent Bridge BD - Azure DevOps CI Pipeline
# Native macOS ARM64 self-hosted agent
# CI validation only - no deployment

trigger:
  branches:
    include:
      - main
      - repair/main-python-syntax-20261122

pr:
  branches:
    include:
      - main

pool:
  name: 'TBBD-Agent-Pool'
  demands:
    - Agent.Name -equals TBBD-Mac-Agent-01-ARM-native

variables:
  pythonExecutable: '/opt/homebrew/bin/python3.11'
  nodeVersion: '20.x'

steps:
  # Checkout source
  - checkout: self
    displayName: 'Checkout TBBD HR Portal repository'
    fetchDepth: 1

  # Display build and source information
  - task: Bash@3
    displayName: 'Display build information'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "=========================================="
        echo "TBBD HR Portal - Azure DevOps CI"
        echo "=========================================="
        echo "Repository: $(Build.Repository.Name)"
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
        echo "Build ID: $(Build.BuildId)"
        echo "Reason: $(Build.Reason)"
        echo "Agent: $(Agent.Name)"
        echo "Agent OS: $(Agent.OS)"
        echo "Agent Architecture: $(Agent.OSArchitecture)"

  # Verify native macOS ARM64 agent
  - task: Bash@3
    displayName: 'Verify Mac agent environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "Agent: ${AGENT_NAME:-unknown}"
        echo "Machine: ${AGENT_MACHINENAME:-unknown}"

        echo
        echo "Operating system:"
        uname -a

        echo
        echo "Machine architecture:"
        uname -m

        if [ "$(uname -m)" != "arm64" ]; then
          echo "ERROR: Native ARM64 macOS agent is required."
          exit 1
        fi

        echo
        echo "Disk availability:"
        df -h .

  # Create isolated Python 3.11 ARM64 environment
  - task: Bash@3
    displayName: 'Create native Python 3.11 ARM64 environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        export PATH="/opt/homebrew/bin:$PATH"

        PYTHON_BIN="$(pythonExecutable)"

        if [ ! -x "$PYTHON_BIN" ]; then
          echo "ERROR: Python executable not found: $PYTHON_BIN"
          exit 1
        fi

        "$PYTHON_BIN" -c "
        import platform
        import sys

        print('Python executable:', sys.executable)
        print('Python version:', sys.version)
        print('Architecture:', platform.machine())

        assert sys.version_info[:2] == (3, 11), \
            'Python 3.11 is required'

        assert platform.machine() == 'arm64', \
            'Native ARM64 Python is required'
        "

        VENV_DIR="$(Agent.TempDirectory)/tbbd-ci-venv-$(Build.BuildId)"

        "$PYTHON_BIN" -m venv "$VENV_DIR"

        CI_PYTHON="$VENV_DIR/bin/python"

        "$CI_PYTHON" --version
        "$CI_PYTHON" -m pip --version

        echo "##vso[task.setvariable variable=TBBD_PYTHON]$CI_PYTHON"

        echo "Native Python environment created successfully."

  # Install backend and test dependencies
  - task: Bash@3
    displayName: 'Install backend and test dependencies'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        if [ ! -f requirements.txt ]; then
          echo "ERROR: requirements.txt is missing."
          exit 1
        fi

        "$(TBBD_PYTHON)" -m pip install --upgrade pip

        "$(TBBD_PYTHON)" -m pip install -r requirements.txt

        # Install pytest separately for CI validation.
        "$(TBBD_PYTHON)" -m pip install pytest

        "$(TBBD_PYTHON)" -m pip check
        "$(TBBD_PYTHON)" -m pytest --version

        echo "Backend and test dependencies installed successfully."

  # Configure Node.js 20
  - task: UseNode@1
    displayName: 'Use Node.js 20'
    inputs:
      version: '$(nodeVersion)'
      checkLatest: false

  # Verify Node.js version
  - task: Bash@3
    displayName: 'Verify Node.js environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        node --version
        npm --version

        node -e "
        const major = Number(process.versions.node.split('.')[0]);

        if (major !== 20) {
          console.error('ERROR: Node.js 20 is required.');
          process.exit(1);
        }
        "

        echo "Node.js 20 verified successfully."

  # Install frontend dependencies
  - task: Bash@3
    displayName: 'Install frontend dependencies'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)/frontend"

        if [ ! -f package.json ]; then
          echo "ERROR: frontend/package.json is missing."
          exit 1
        fi

        if [ ! -f package-lock.json ]; then
          echo "ERROR: frontend/package-lock.json is missing."
          exit 1
        fi

        npm ci

        echo "Frontend dependencies installed successfully."

  # Build React frontend
  - task: Bash@3
    displayName: 'Build frontend'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)/frontend"

        npm run build

        if [ ! -f dist/index.html ]; then
          echo "ERROR: Frontend build did not produce dist/index.html."
          exit 1
        fi

        echo "Frontend production build completed successfully."

  # Prepare frontend assets for backend tests
  - task: Bash@3
    displayName: 'Prepare frontend assets'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        for required_file in \
          frontend/dist/index.html \
          frontend/dist/redirect.html
        do
          if [ ! -f "$required_file" ]; then
            echo "ERROR: Required frontend file missing: $required_file"
            exit 1
          fi
        done

        if [ ! -d frontend/dist/assets ]; then
          echo "ERROR: frontend/dist/assets directory is missing."
          exit 1
        fi

        mkdir -p dist

        cp -R frontend/dist/. dist/

        test -f dist/index.html
        test -f dist/redirect.html
        test -d dist/assets

        echo "Frontend assets prepared successfully."

  # Compile all maintained Python source
  - task: Bash@3
    displayName: 'Validate Python source'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        echo "Compiling Python backend and test source..."

        "$(TBBD_PYTHON)" -m compileall -q \
          main.py \
          api \
          services \
          models \
          repositories \
          tests

        echo "Python source compilation completed successfully."

  # Run backend test suite
  - task: Bash@3
    displayName: 'Run backend tests'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        TEST_EXCLUSION=""

        if [ -f test_email_send.py ]; then
          TEST_EXCLUSION="test_email_send.py"
        elif [ -f tests/test_email_send.py ]; then
          TEST_EXCLUSION="tests/test_email_send.py"
        fi

        if [ -n "$TEST_EXCLUSION" ]; then
          echo "Excluding: $TEST_EXCLUSION"
          "$(TBBD_PYTHON)" -m pytest -q --ignore="$TEST_EXCLUSION"
        else
          echo "No test_email_send.py exclusion file found."
          "$(TBBD_PYTHON)" -m pytest -q
        fi

  # Final CI summary
  - task: Bash@3
    displayName: 'Final CI summary'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "=========================================="
        echo "TBBD HR PORTAL CI PASSED"
        echo "=========================================="

        echo "Repository: $(Build.Repository.Name)"
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
        echo "Build ID: $(Build.BuildId)"
        echo "Agent: $(Agent.Name)"

        echo "Native macOS ARM64: verified"
        echo "Python 3.11 ARM64: verified"
        echo "Node.js 20: verified"
        echo "Backend dependencies: installed"
        echo "Frontend production build: completed"
        echo "Frontend assets: verified"
        echo "Python compilation: passed"
        echo "Backend tests: passed"

        echo "Deployment: not performed"
        echo "Production resources: not modified"
