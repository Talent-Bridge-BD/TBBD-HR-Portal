
# Talent Bridge BD - HR Portal
# Azure DevOps CI Pipeline
# Native macOS ARM64 self-hosted agent
# CI validation only - no deployment

trigger:
  - main

pr:
  - main

pool:
  name: 'TBBD-Agent-Pool'
  demands:
    - Agent.Name -equals TBBD-Mac-Agent-01-ARM-native

variables:
  pythonExecutable: '/opt/homebrew/bin/python3.11'
  nodeVersion: '20.x'

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: Bash@3
    displayName: 'Verify Mac agent environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "Agent: ${AGENT_NAME:-unknown}"
        echo "Machine: ${AGENT_MACHINENAME:-unknown}"
        echo "Operating system:"
        uname -a
        echo "Architecture: $(uname -m)"
        echo "Bash: ${BASH_VERSION:-unknown}"
        df -h .

  - task: Bash@3
    displayName: 'Display build information'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "Build ID: $(Build.BuildId)"
        echo "Build number: $(Build.BuildNumber)"
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
        echo "Repository: $(Build.Repository.Name)"

  - task: Bash@3
    displayName: 'Create native Python 3.11 ARM64 environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        PYTHON_BIN="$(pythonExecutable)"

        if [ ! -x "$PYTHON_BIN" ]; then
          echo "ERROR: Python executable not found: $PYTHON_BIN"
          exit 1
        fi

        "$PYTHON_BIN" -c "import sys, platform; print('Executable:', sys.executable); print('Version:', sys.version); print('Architecture:', platform.machine()); assert sys.version_info[:2] == (3, 11), 'Python 3.11 is required'; assert platform.machine() == 'arm64', 'ARM64 Python is required'"

        VENV_DIR="$(Agent.TempDirectory)/tbbd-ci-venv-$(Build.BuildId)"

        "$PYTHON_BIN" -m venv "$VENV_DIR"

        CI_PYTHON="$VENV_DIR/bin/python"

        "$CI_PYTHON" --version
        "$CI_PYTHON" -m pip --version

        echo "##vso[task.setvariable variable=TBBD_PYTHON]$CI_PYTHON"

        echo "Native Python 3.11 ARM64 environment created."

  - task: Bash@3
    displayName: 'Install backend and test dependencies'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        CI_PYTHON="$(TBBD_PYTHON)"

        "$CI_PYTHON" -m pip install --upgrade pip
        "$CI_PYTHON" -m pip install -r requirements.txt
        "$CI_PYTHON" -m pip install -r requirements-dev.txt
        "$CI_PYTHON" -m pip check
        "$CI_PYTHON" -m pytest --version

        echo "Backend and test dependencies installed."

  - task: UseNode@1
    displayName: 'Install Node.js'
    inputs:
      version: '$(nodeVersion)'

  - task: Bash@3
    displayName: 'Verify Node.js version'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        node --version
        npm --version

        NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"

        if [ "$NODE_MAJOR" != "20" ]; then
          echo "ERROR: Node.js 20 is required; found major version $NODE_MAJOR"
          exit 1
        fi

        echo "Node.js 20 verified."

  - task: Bash@3
    displayName: 'Install frontend dependencies'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd frontend

        npm ci

        echo "Frontend dependencies installed."

  - task: Bash@3
    displayName: 'Build frontend'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd frontend

        npm run build

        test -s dist/index.html
        test -s dist/redirect.html
        test -d dist/assets

        echo "Frontend build completed."
        echo "Verified frontend index.html."
        echo "Verified frontend redirect.html."
        echo "Verified frontend assets directory."

  - task: Bash@3
    displayName: 'Prepare root frontend distribution'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        if [ ! -d frontend/dist ]; then
          echo "ERROR: frontend/dist does not exist."
          exit 1
        fi

        mkdir -p dist
        cp -R frontend/dist/. dist/

        test -s dist/index.html
        test -s dist/redirect.html
        test -d dist/assets

        echo "Root distribution prepared and verified."

  - task: Bash@3
    displayName: 'Compile Python source'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        CI_PYTHON="$(TBBD_PYTHON)"

        "$CI_PYTHON" -m compileall -q \
          main.py \
          api \
          services \
          models \
          repositories \
          tests

        echo "Python compilation completed."

  - task: Bash@3
    displayName: 'Run backend tests'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        CI_PYTHON="$(TBBD_PYTHON)"

        "$CI_PYTHON" -m pytest -q --ignore=test_email_send.py

        echo "Backend tests completed."

  - task: Bash@3
    displayName: 'CI validation summary'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "========================================"
        echo "TALENT BRIDGE BD - CI SUMMARY"
        echo "========================================"
        echo "Python: 3.11 ARM64"
        echo "Node.js: 20.x"
        echo "Frontend build completed."
        echo "Python compilation completed."
        echo "Backend tests completed."
        echo "No Azure deployment was performed."
        echo "========================================"
