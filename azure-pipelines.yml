
# TBBD HR Portal
# Azure DevOps CI Pipeline
# CI validation only - no deployment or production changes

trigger:
  - main

pr:
  - main

pool:
  name: 'TBBD-Agent-Pool'

variables:
  pythonVersion: '3.11'
  nodeVersion: '20.x'

steps:
  - checkout: self
    displayName: 'Checkout TBBD HR Portal repository'

  - script: |
      echo "=========================================="
      echo "TBBD HR Portal - Azure DevOps CI"
      echo "=========================================="
      echo "Repository: $(Build.Repository.Name)"
      echo "Branch: $(Build.SourceBranch)"
      echo "Commit: $(Build.SourceVersion)"
      echo "Build ID: $(Build.BuildId)"
      echo "Agent: $(Agent.Name)"
      echo "Agent OS: $(Agent.OS)"
      echo "Agent Architecture: $(Agent.OSArchitecture)"
    displayName: 'Display build information'

  # Python 3.11 environment
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"

      command -v python3.11
      python3.11 --version
      python3.11 -m pip --version
      python3.11 -c "import platform; print('Architecture:', platform.machine())"
    displayName: 'Verify Python 3.11 environment'

  # Backend dependencies and CI-only pytest
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"

      python3.11 -m pip install --upgrade pip
      python3.11 -m pip install -r requirements.txt
      python3.11 -m pip install pytest
      python3.11 -m pytest --version
    displayName: 'Install backend dependencies'

  # Node.js 20
  - task: UseNode@1
    displayName: 'Set Node.js version'
    inputs:
      version: '$(nodeVersion)'

  - script: |
      node --version
      npm --version
    displayName: 'Verify Node.js environment'

  # Build frontend BEFORE importing the application in pytest.
  - script: |
      npm ci
    workingDirectory: 'frontend'
    displayName: 'Install frontend dependencies'

  - script: |
      npm run build
    workingDirectory: 'frontend'
    displayName: 'Build React frontend'

  # Validate Python source
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"
      python3.11 -m compileall -q .
    displayName: 'Validate Python source'

  # Run backend tests after frontend assets exist
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"
      python3.11 -m pytest -q --ignore=test_email_send.py
    displayName: 'Run backend tests'

  # Final CI summary
  - script: |
      echo "=========================================="
      echo "TBBD HR Portal CI validation completed."
      echo "=========================================="
      echo "Python source validation: completed"
      echo "Backend tests: passed"
      echo "Frontend production build: completed"
      echo "No deployment or production changes performed."
    displayName: 'CI build summary'
