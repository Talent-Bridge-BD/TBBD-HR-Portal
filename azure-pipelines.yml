# TBBD HR Portal
# Azure DevOps CI Pipeline
# Self-hosted Mac CI validation only
# No deployment or production changes

trigger:
  - main

pr:
  - main

pool:
  name: 'TBBD-Agent-Pool'

variables:
  pythonVersion: '3.11'
  nodeVersion: '20.x'

steps:
  # Checkout repository
  - checkout: self
    displayName: 'Checkout TBBD HR Portal repository'

  # Verify Mac agent environment
  - task: Bash@3
    displayName: 'Verify Mac Agent Environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu
        export PATH="/opt/homebrew/bin:$PATH"

        echo "Bash is working"
        bash --version | head -n 1
        echo "Operating system:"
        uname -a
        echo "Architecture:"
        uname -m
        echo "Available disk space:"
        df -h /

  # Display build information
  - script: |
      set -eu
      echo "TBBD HR Portal - Azure DevOps CI"
      echo "Repository: $(Build.Repository.Name)"
      echo "Branch: $(Build.SourceBranch)"
      echo "Commit: $(Build.SourceVersion)"
      echo "Build ID: $(Build.BuildId)"
    displayName: 'Display build information'

  # Verify Python 3.11
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"

      python3.11 --version
      python3.11 -m pip --version
    displayName: 'Verify Python environment'

  # Install backend dependencies
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"

      if [ -f requirements.txt ]; then
        python3.11 -m pip install --upgrade pip
        python3.11 -m pip install -r requirements.txt
      else
        echo "requirements.txt not found."
        echo "Skipping Python dependency installation."
      fi
    displayName: 'Install backend dependencies'

  # Validate Python source
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"

      python3.11 -m compileall -q .
    displayName: 'Validate Python source'

  # Verify Node.js environment
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"

      node --version
      npm --version
    displayName: 'Verify Node.js environment'

  # Install frontend dependencies
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"

      cd frontend
      if [ -f package-lock.json ]; then
        npm ci
      else
        npm install
      fi
    displayName: 'Install frontend dependencies'

  # Build React frontend
  - script: |
      set -eu
      export PATH="/opt/homebrew/bin:$PATH"

      cd frontend
      npm run build
    displayName: 'Build React frontend'

  # Final CI summary
  - script: |
      set -eu
      echo "TBBD HR Portal CI validation completed."
      echo "Agent pool: TBBD-Agent-Pool"
      echo "Expected agent: TBBD-Mac-Agent-01-ARM-native"
      echo "No deployment or production changes performed."
    displayName: 'CI build summary'