trigger:
  - main

pr:
  - main

pool:
  name: 'TBBD-Agent-Pool'
  demands:
    - Agent.Name -equals TBBD-Mac-Agent-01-ARM-native

variables:
  pythonExecutable: '/opt/homebrew/bin/python3.11'
  nodeVersion: '20.x'

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: Bash@3
    displayName: 'Verify Mac agent environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "Agent: ${AGENT_NAME:-unknown}"
        echo "Machine: ${AGENT_MACHINENAME:-unknown}"
        echo "Operating system:"
        uname -a
        echo "Architecture: $(uname -m)"
        echo "Bash: ${BASH_VERSION:-unknown}"
        df -h .

  - script: |
      set -eu

      echo "Build ID: $(Build.BuildId)"
      echo "Build number: $(Build.BuildNumber)"
      echo "Branch: $(Build.SourceBranch)"
      echo "Commit: $(Build.SourceVersion)"
      echo "Repository: $(Build.Repository.Name)"
    displayName: 'Display build information'

  - task: Bash@3
    displayName: 'Create native Python 3.11 ARM64 environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        PYTHON_BIN="$(pythonExecutable)"

        if [ ! -x "$PYTHON_BIN" ]; then
          echo "ERROR: Python executable not found: $PYTHON_BIN"
          exit 1
        fi

        "$PYTHON_BIN" -c "import sys, platform; print('Executable:', sys.executable); print('Version:', sys.version); print('Architecture:', platform.machine()); assert sys.version_info[:2] == (3, 11), 'Python 3.11 is required'; assert platform.machine() == 'arm64', 'ARM64 Python is required'"

        VENV_DIR="$(Agent.TempDirectory)/tbbd-ci-venv-$(Build.BuildId)"

        "$PYTHON_BIN" -m venv "$VENV_DIR"

        CI_PYTHON="$VENV_DIR/bin/python"

        "$CI_PYTHON" --version
        "$CI_PYTHON" -m pip --version

        echo "##vso[task.setvariable variable=TBBD_PYTHON]$CI_PYTHON"

        echo "Native Python 3.11 ARM64 environment created."

  - task: Bash@3
    displayName: 'Install backend dependencies'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        if [ ! -f requirements.txt ]; then
          echo "ERROR: requirements.txt is missing."
          exit 1
        fi

        "$(TBBD_PYTHON)" -m pip install -r requirements.txt

        "$(TBBD_PYTHON)" -m pip check

        echo "Backend dependencies installed successfully."

  - task: UseNode@1
    displayName: 'Use Node.js 20'
    inputs:
      version: '$(nodeVersion)'
      checkLatest: false

  - task: Bash@3
    displayName: 'Verify Node.js environment'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        node --version
        npm --version

        node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 20) { console.error('Node.js 20 is required.'); process.exit(1); }"

        echo "Node.js 20 verified."

  - task: Bash@3
    displayName: 'Install frontend dependencies'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)/frontend"

        if [ ! -f package-lock.json ]; then
          echo "ERROR: frontend/package-lock.json is missing."
          exit 1
        fi

        npm ci

  - task: Bash@3
    displayName: 'Build frontend'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)/frontend"

        npm run build

        if [ ! -f dist/index.html ]; then
          echo "ERROR: frontend build did not produce dist/index.html."
          exit 1
        fi

  - task: Bash@3
    displayName: 'Prepare frontend assets'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"

        if [ ! -d frontend/dist ]; then
          echo "ERROR: frontend/dist does not exist."
          exit 1
        fi

        mkdir -p dist
        cp -R frontend/dist/. dist/

        if [ ! -f dist/index.html ]; then
          echo "ERROR: root dist/index.html is missing."
          exit 1
        fi

        echo "Frontend assets prepared successfully."

  - task: Bash@3
    displayName: 'Compile Python backend'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"
        "$(TBBD_PYTHON)" -m compileall -q .

        echo "Python backend compilation completed."

  - task: Bash@3
    displayName: 'Run backend tests'
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        cd "$(Build.SourcesDirectory)"
        "$(TBBD_PYTHON)" -m pytest -q --ignore=test_email_send.py

  - task: Bash@3
    displayName: 'Final CI summary'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        set -eu

        echo "TBBD HR Portal CI completed successfully."
        echo "Agent: ${AGENT_NAME:-unknown}"
        echo "Build ID: $(Build.BuildId)"
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
        echo "Native Python 3.11 ARM64 verified."
        echo "Node.js 20 verified."
        echo "Frontend build completed."
        echo "Backend compilation completed."
        echo "Backend tests completed."
        echo "No Azure deployment was performed."