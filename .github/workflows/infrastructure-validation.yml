name: Infrastructure Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  validate-infrastructure:
    name: Validate Azure Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Validate Bicep Templates
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            echo "===== Install Bicep CLI if missing ====="
            if ! az bicep version >/dev/null 2>&1; then
              az bicep install
            fi

            echo "===== Verify Bicep CLI ====="
            az bicep version

            echo "===== Validate Bicep Templates ====="
            found=0

            while IFS= read -r -d '' template; do
              found=1
              echo "Validating: $template"
              az bicep build --file "$template" --stdout >/dev/null
            done < <(find infrastructure/bicep -type f -name "*.bicep" -print0)

            if [ "$found" -eq 0 ]; then
              echo "INFO: No Bicep templates found. Validation skipped."
            else
              echo "All Bicep templates validated successfully."
            fi
