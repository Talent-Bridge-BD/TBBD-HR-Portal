
name: Infrastructure Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-infrastructure:
    name: Validate Azure Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Validate Bicep Templates
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            set -euo pipefail

            BICEP_DIR="infrastructure/bicep"

            if [ ! -d "$BICEP_DIR" ]; then
              echo "ERROR: Bicep directory not found: $BICEP_DIR"
              exit 1
            fi

            az bicep install
            az bicep version

            mapfile -d '' BICEP_FILES < <(
              find "$BICEP_DIR" -type f -name "*.bicep" -print0
            )

            if [ "${#BICEP_FILES[@]}" -eq 0 ]; then
              echo "ERROR: No Bicep templates found in $BICEP_DIR"
              exit 1
            fi

            for file in "${BICEP_FILES[@]}"; do
              echo "Validating: $file"
              az bicep build --file "$file" --stdout > /dev/null
            done

            echo "All Bicep templates compiled successfully."
